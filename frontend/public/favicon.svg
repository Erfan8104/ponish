<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#favGrad)"/>

  <!-- simplified triangulated peak: 3 bold facets, no fine detail -->
  <polygon points="4,24 13,17 17,24" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="13,17 16,6 22,15" fill="#FFFFFF" opacity="1"/>
  <polygon points="13,17 22,15 17,24" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="22,15 28,23 17,24" fill="#FFFFFF" opacity="0.5"/>

  <!-- single bold peak marker, no thin crosshair lines -->
  <circle cx="16" cy="6" r="2.1" fill="#FFFFFF"/>
</svg>
