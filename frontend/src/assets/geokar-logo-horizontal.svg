<svg width="300" height="76" viewBox="0 0 300 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="geokarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="geokarTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Mark: triangulated terrain peak (TIN survey mesh) -->
  <g transform="translate(6,6)">
    <!-- ground datum line -->
    <line x1="0" y1="50" x2="62" y2="50" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- mesh facets -->
    <polygon points="6,48 22,36 34,48" fill="url(#geokarGrad)" opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="22,36 32,10 44,30" fill="url(#geokarGrad)" opacity="1" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="22,36 44,30 34,48" fill="url(#geokarGrad)" opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="44,30 58,46 34,48" fill="url(#geokarGrad)" opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-linejoin="round"/>

    <!-- survey nodes -->
    <circle cx="6" cy="48" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="22" cy="36" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="44" cy="30" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="34" cy="48" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="58" cy="46" r="1.8" fill="#FFFFFF" opacity="0.9"/>

    <!-- benchmark / control point at peak -->
    <circle cx="32" cy="10" r="3.4" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="32" cy="10" r="1" fill="#FFFFFF"/>
    <line x1="32" y1="5" x2="32" y2="7.2" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="32" y1="12.8" x2="32" y2="15" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(84,0)">
    <text x="0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#E2E8F0" letter-spacing="-0.5">Geo</text>
    <text x="63" y="36" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="url(#geokarTextGrad)" letter-spacing="-0.5">Kar</text>
    <text x="0" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.5">SURVEY MARKETPLACE</text>
  </g>
</svg>
