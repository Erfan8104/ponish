<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="geokarGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#geokarGradBg)"/>

  <g transform="translate(32,30)">
    <!-- ground datum line -->
    <line x1="0" y1="50" x2="62" y2="50" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="2 3"/>

    <!-- mesh facets -->
    <polygon points="6,48 22,36 34,48" fill="#FFFFFF" opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="22,36 32,10 44,30" fill="#FFFFFF" opacity="1" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="22,36 44,30 34,48" fill="#FFFFFF" opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="44,30 58,46 34,48" fill="#FFFFFF" opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>

    <!-- survey nodes -->
    <circle cx="6" cy="48" r="2" fill="#4F46E5"/>
    <circle cx="22" cy="36" r="2" fill="#4F46E5"/>
    <circle cx="44" cy="30" r="2" fill="#4F46E5"/>
    <circle cx="34" cy="48" r="2" fill="#4F46E5"/>
    <circle cx="58" cy="46" r="2" fill="#4F46E5"/>

    <!-- benchmark / control point at peak -->
    <circle cx="32" cy="10" r="3.8" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="32" cy="10" r="1.2" fill="#FFFFFF"/>
    <line x1="32" y1="4.5" x2="32" y2="7" stroke="#FFFFFF" stroke-width="1.4"/>
    <line x1="32" y1="13" x2="32" y2="15.5" stroke="#FFFFFF" stroke-width="1.4"/>
  </g>
</svg>
